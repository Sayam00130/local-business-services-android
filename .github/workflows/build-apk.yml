name: Build Fresh Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create fresh Flutter project
        run: |
          flutter create --org com.localbusinessservices --project-name local_business_services app

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-business-services-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
