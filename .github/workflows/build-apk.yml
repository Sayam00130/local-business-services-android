name: Build Fresh Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Flutter project
        run: |
          git clone https://github.com/${{ github.repository }}.git project
          cd project
          git checkout ${{ github.sha }}
          rm -rf ./*
          flutter create --org com.localbusinessservices --project-name local_business_services .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        working-directory: project
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-business-services-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
