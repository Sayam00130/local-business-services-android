name: Build Local Business Services APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.localbusinessservices \
            --project-name local_business_services \
            app

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' app/android/app/src/main/AndroidManifest.xml

      - name: Copy main.dart
        run: |
          cp lib/main.dart app/lib/main.dart

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add url_launcher
          flutter pub add http

      - name: Build APK
        working-directory: app
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-business-services-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
