name: Build Local Business Services APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.localbusinessservices \
            --project-name local_business_services \
            app

      - name: Copy main.dart
        run: |
          cp lib/main.dart app/lib/main.dart

      - name: Add url_launcher
        working-directory: app
        run: |
          flutter pub add url_launcher

      - name: Configure Android URL queries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          queries = """    <queries>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:scheme="tel" />
              </intent>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:scheme="https" />
              </intent>
          </queries>
          """

          text = text.replace("</manifest>", queries + "</manifest>")
          path.write_text(text)
          PY

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-business-services-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
