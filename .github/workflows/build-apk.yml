name: Build Local Business Services APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.localbusinessservices \
            --project-name local_business_services \
            app

      - name: Copy app files
        run: |
          cp lib/main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml

      - name: Create Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json

      - name: Add Google Services plugin
        working-directory: app/android
        run: |
          sed -i "/plugins {/a\\    id 'com.google.gms.google-services' version '4.4.2' apply false" settings.gradle

      - name: Apply Google Services plugin
        working-directory: app/android/app
        run: |
          sed -i "/plugins {/a\\    id 'com.google.gms.google-services'" build.gradle.kts

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' \
          app/android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: app
        run: |
          flutter pub get

      - name: Build APK
        working-directory: app
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-business-services-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
