name: Build Local Business Services APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create fresh Flutter project
        run: |
          flutter create \
            --org com.localbusinessservices \
            --project-name local_business_services \
            app

      - name: Set Android package name
        working-directory: app/android/app
        run: |
          sed -i 's/applicationId = "com.localbusinessservices.local_business_services"/applicationId = "com.localbusinessservices"/' build.gradle.kts
          sed -i 's/namespace = "com.localbusinessservices.local_business_services"/namespace = "com.localbusinessservices"/' build.gradle.kts

      - name: Fix MainActivity package
        run: |
          mkdir -p app/android/app/src/main/kotlin/com/localbusinessservices

          cat > app/android/app/src/main/kotlin/com/localbusinessservices/MainActivity.kt <<'EOF'
          package com.localbusinessservices

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

          rm -rf app/android/app/src/main/kotlin/com/example

      - name: Copy main.dart
        run: |
          cp lib/main.dart app/lib/main.dart

      - name: Add required packages
        working-directory: app
        run: |
          flutter pub add http
          flutter pub add url_launcher
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json

          test -s app/android/app/google-services.json

      - name: Configure Google Services plugin
        working-directory: app/android
        run: |
          sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' settings.gradle.kts

      - name: Enable Google Services plugin
        working-directory: app/android/app
        run: |
          sed -i '/plugins {/a\    id("com.google.gms.google-services")' build.gradle.kts

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' \
            app/android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: app
        run: |
          flutter clean
          flutter pub get

      - name: Verify Firebase packages
        working-directory: app
        run: |
          flutter pub deps | grep -E "firebase_core|firebase_auth|cloud_firestore"

      - name: Build Release APK
        working-directory: app
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-business-services-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
